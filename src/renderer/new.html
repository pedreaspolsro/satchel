<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>New session</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="newwin">
  <form id="f" class="newwin-form">
    <label>Profile <select id="profile"></select></label>
    <label>Folder <span class="row-inline"><input id="cwd" type="text" spellcheck="false"><button id="browse" type="button" title="Browse">…</button></span></label>
    <label>Label <input id="label" type="text" placeholder="what is this session about?" spellcheck="false"></label>
    <div id="err" class="newwin-err" hidden></div>
    <div class="form-actions">
      <button id="cancel" type="button">Cancel</button>
      <button id="launch" class="primary" type="submit">Launch</button>
    </div>
  </form>
  <script src="new.js"></script>
</body>
</html>
